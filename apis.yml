aid: players-lounge
name: Players Lounge
description: >-
  Players' Lounge is a skill-based competitive gaming platform where users win
  money by completing personalized head-to-head gaming challenges (money
  matches) or by staking and watching other players compete. The platform
  supports popular console and PC titles including Madden, NBA 2K, Call of Duty
  Warzone, Marvel Rivals, and others, and states it has paid out over $200M to
  players to date. Players' Lounge is a consumer product surfaced as a portfolio
  company of Canaan Partners; it exposes no public developer API, SDK, or API
  documentation at this time. This profile captures the company's public
  identity and web properties for the API Evangelist network.
